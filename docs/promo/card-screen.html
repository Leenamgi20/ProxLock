<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>NoSleep card - screen</title>
<style>
  html,body{margin:0;background:#0f1220}
  body{width:1600px;height:900px;overflow:hidden;font-family:"Malgun Gothic","Apple SD Gothic Neo","Segoe UI",sans-serif}
</style></head>
<body>
<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151a2e"/><stop offset="1" stop-color="#0c0f1a"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f5f7"/><stop offset="1" stop-color="#c9ced6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".45"/></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>

    <!-- Simple person holding a headset in one hand (just taken off) -->
    <g id="person">
      <rect x="-120" y="40" width="240" height="230" rx="110" fill="#2f3650"/>
      <circle cx="0" cy="-30" r="78" fill="#f2c9a6"/>
      <path d="M-78 -40 C -74 -120, 74 -120, 78 -40 C 60 -78, -60 -78, -78 -40 Z" fill="#2b2140"/>
      <path d="M95 90 C 150 60, 190 20, 215 -20" fill="none" stroke="#2f3650" stroke-width="44" stroke-linecap="round"/>
      <circle cx="222" cy="-30" r="24" fill="#f2c9a6"/>
    </g>
    <!-- Generic headset, front view, held sideways -->
    <g id="hmd">
      <rect x="-95" y="-52" width="190" height="104" rx="44" fill="url(#shell)"/>
      <rect x="-82" y="-40" width="164" height="80" rx="36" fill="#1b1f2a"/>
      <circle cx="-48" cy="0" r="7" fill="#3b4256"/><circle cx="48" cy="0" r="7" fill="#3b4256"/>
      <path d="M95 -10 C 140 -10, 150 40, 120 60" fill="none" stroke="#3a3f4b" stroke-width="12" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <text x="800" y="118" text-anchor="middle" font-size="64" font-weight="800" fill="#ffffff">잠깐 벗어도, 화면은 그대로.</text>
  <text x="800" y="172" text-anchor="middle" font-size="28" fill="#9aa3b8">헤드셋을 벗을 때마다 대기모드로 넘어가던 Quest, NoSleep for Quest로 깨어 있게</text>

  <!-- LEFT: screen goes to sleep -->
  <g transform="translate(420 500)">
    <rect x="-330" y="-270" width="660" height="560" rx="36" fill="#1a1f33" stroke="#2c3350" stroke-width="2"/>
    <rect x="-300" y="-245" width="128" height="44" rx="22" fill="#3a1f27"/>
    <text x="-236" y="-215" text-anchor="middle" font-size="22" font-weight="700" fill="#fb7185">BEFORE</text>

    <g transform="translate(-140 -40) scale(0.7)" filter="url(#soft)">
      <use href="#person"/>
      <!-- frown + sweat -->
      <path d="M-26 6 Q 0 -8 26 6" fill="none" stroke="#7a4a35" stroke-width="5" stroke-linecap="round"/>
      <circle cx="-26" cy="-40" r="6" fill="#3b2a24"/><circle cx="26" cy="-40" r="6" fill="#3b2a24"/>
      <path d="M70 -86 q 10 18 0 26 q -10 -8 0 -26 Z" fill="#7dd3fc"/>
    </g>
    <g transform="translate(60 -80) rotate(-12) scale(0.85)" filter="url(#soft)"><use href="#hmd"/></g>

    <!-- what the headset shows: black screen, zzz -->
    <g transform="translate(140 -190)">
      <rect x="-90" y="-52" width="180" height="104" rx="14" fill="#05060a" stroke="#3a3f55" stroke-width="3"/>
      <text x="0" y="16" text-anchor="middle" font-size="44" font-weight="800" fill="#4b5470">Zzz</text>
      <path d="M-30 52 L -10 74 L 0 52" fill="#05060a" stroke="#3a3f55" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <text x="0" y="200" text-anchor="middle" font-size="38" font-weight="800" fill="#ffffff">벗으면 바로 대기모드</text>
    <text x="0" y="246" text-anchor="middle" font-size="25" fill="#a7afc4">다시 쓰면 깨우고 · 연결 확인하고 · 번거로움</text>
  </g>

  <!-- arrow -->
  <g transform="translate(800 470)">
    <circle r="46" fill="#5eead4"/>
    <path d="M-16 -18 L14 0 L-16 18" fill="none" stroke="#0f1220" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- RIGHT: stays awake -->
  <g transform="translate(1180 500)">
    <rect x="-330" y="-270" width="660" height="560" rx="36" fill="#14282b" stroke="#2a5a58" stroke-width="2"/>
    <rect x="-300" y="-245" width="110" height="44" rx="22" fill="#134e4a"/>
    <text x="-245" y="-215" text-anchor="middle" font-size="22" font-weight="700" fill="#5eead4">AFTER</text>

    <g transform="translate(-140 -40) scale(0.7)" filter="url(#soft)">
      <use href="#person"/>
      <!-- smile -->
      <path d="M-26 0 Q 0 22 26 0" fill="none" stroke="#7a4a35" stroke-width="5" stroke-linecap="round"/>
      <circle cx="-26" cy="-40" r="6" fill="#3b2a24"/><circle cx="26" cy="-40" r="6" fill="#3b2a24"/>
    </g>
    <g transform="translate(60 -80) rotate(-12) scale(0.85)" filter="url(#soft)"><use href="#hmd"/></g>

    <!-- what the headset shows: still on -->
    <g transform="translate(140 -190)">
      <rect x="-90" y="-52" width="180" height="104" rx="14" fill="#0e2a33" stroke="#5eead4" stroke-width="3"/>
      <rect x="-70" y="-34" width="64" height="40" rx="6" fill="#5eead4" opacity=".85"/>
      <rect x="4" y="-34" width="66" height="16" rx="6" fill="#7dd3fc" opacity=".8"/>
      <rect x="4" y="-12" width="48" height="16" rx="6" fill="#7dd3fc" opacity=".55"/>
      <rect x="-70" y="16" width="140" height="14" rx="6" fill="#5eead4" opacity=".5"/>
      <path d="M-30 52 L -10 74 L 0 52" fill="#0e2a33" stroke="#5eead4" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <text x="0" y="200" text-anchor="middle" font-size="38" font-weight="800" fill="#ffffff">벗어도 계속 켜짐</text>
    <text x="0" y="246" text-anchor="middle" font-size="25" fill="#a7d8d2">대기모드로 안 넘어감 · 재부팅해도 유지</text>
  </g>

  <text x="800" y="862" text-anchor="middle" font-size="24" fill="#6b7590">NoSleep for Quest · 무료 · 오픈소스 · github.com/Leenamgi20/NoSleep-for-Quest</text>
</svg>
</body></html>
