<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>NoSleep card - tape</title>
<style>
  html,body{margin:0;background:#0f1220}
  body{width:1600px;height:900px;overflow:hidden;font-family:"Malgun Gothic","Apple SD Gothic Neo","Segoe UI",sans-serif}
</style></head>
<body>
<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151a2e"/><stop offset="1" stop-color="#0c0f1a"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f5f7"/><stop offset="1" stop-color="#cfd3da"/>
    </linearGradient>
    <linearGradient id="cushion" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f4b"/><stop offset="1" stop-color="#22262f"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#6b7a99"/><stop offset="0.55" stop-color="#1d2433"/><stop offset="1" stop-color="#0b0e15"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".45"/></filter>

    <!-- Generic VR headset seen from the face side: cushion, two lenses, nose gap, proximity sensor between lenses -->
    <g id="headset">
      <rect x="-230" y="-130" width="460" height="260" rx="120" fill="url(#shell)"/>
      <rect x="-205" y="-108" width="410" height="216" rx="100" fill="url(#cushion)"/>
      <circle cx="-92" cy="-8" r="62" fill="url(#lens)" stroke="#11141b" stroke-width="6"/>
      <circle cx="92" cy="-8" r="62" fill="url(#lens)" stroke="#11141b" stroke-width="6"/>
      <circle cx="-110" cy="-28" r="12" fill="#fff" opacity=".18"/>
      <circle cx="74" cy="-28" r="12" fill="#fff" opacity=".18"/>
      <path d="M-42 108 C -38 52, 38 52, 42 108 Z" fill="#0f1220"/>
      <circle cx="0" cy="-58" r="9" fill="#0b0d12" stroke="#59607a" stroke-width="3"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- title -->
  <text x="800" y="118" text-anchor="middle" font-size="64" font-weight="800" fill="#ffffff">테이프 말고, 앱으로.</text>
  <text x="800" y="172" text-anchor="middle" font-size="28" fill="#9aa3b8">Quest 근접 센서를 테이프로 가리던 방법, 이제 NoSleep for Quest 하나로</text>

  <!-- BEFORE panel -->
  <g transform="translate(420 500)">
    <rect x="-330" y="-270" width="660" height="560" rx="36" fill="#1a1f33" stroke="#2c3350" stroke-width="2"/>
    <rect x="-300" y="-245" width="128" height="44" rx="22" fill="#3a1f27"/>
    <text x="-236" y="-215" text-anchor="middle" font-size="22" font-weight="700" fill="#fb7185">BEFORE</text>
    <g transform="translate(0 -40)" filter="url(#soft)">
      <use href="#headset"/>
      <!-- tape over the sensor -->
      <g transform="translate(0 -58) rotate(-14)">
        <rect x="-62" y="-22" width="124" height="44" rx="4" fill="#e9d8a6" opacity=".95"/>
        <path d="M-62 -22 l-8 6 l8 6 l-8 6 l8 6 l-8 6 l8 6 l-8 6 l8 4" fill="none" stroke="#e9d8a6" stroke-width="3"/>
        <path d="M62 -22 l8 6 l-8 6 l8 6 l-8 6 l8 6 l-8 6 l8 6 l-8 4" fill="none" stroke="#e9d8a6" stroke-width="3"/>
        <rect x="-62" y="-22" width="124" height="10" fill="#fff" opacity=".25"/>
      </g>
    </g>
    <text x="0" y="178" text-anchor="middle" font-size="38" font-weight="800" fill="#ffffff">센서에 테이프 붙이기</text>
    <text x="0" y="226" text-anchor="middle" font-size="25" fill="#a7afc4">떼었다 붙였다 · 끈적임 · 깜빡하면 다시 잠듦</text>
  </g>

  <!-- arrow -->
  <g transform="translate(800 470)">
    <circle r="46" fill="#5eead4"/>
    <path d="M-16 -18 L14 0 L-16 18" fill="none" stroke="#0f1220" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- AFTER panel -->
  <g transform="translate(1180 500)">
    <rect x="-330" y="-270" width="660" height="560" rx="36" fill="#14282b" stroke="#2a5a58" stroke-width="2"/>
    <rect x="-300" y="-245" width="110" height="44" rx="22" fill="#134e4a"/>
    <text x="-245" y="-215" text-anchor="middle" font-size="22" font-weight="700" fill="#5eead4">AFTER</text>
    <g transform="translate(0 -40)" filter="url(#soft)">
      <use href="#headset"/>
      <!-- "sensor off" badge pointing at the sensor -->
      <line x1="0" y1="-72" x2="0" y2="-150" stroke="#5eead4" stroke-width="4" stroke-dasharray="6 6"/>
      <g transform="translate(0 -182)">
        <rect x="-118" y="-30" width="236" height="60" rx="30" fill="#5eead4"/>
        <rect x="-102" y="-17" width="62" height="34" rx="17" fill="#0f1220"/>
        <circle cx="-85" cy="0" r="12" fill="#5eead4"/>
        <text x="30" y="10" text-anchor="middle" font-size="26" font-weight="800" fill="#0f1220">센서 OFF</text>
      </g>
    </g>
    <text x="0" y="178" text-anchor="middle" font-size="38" font-weight="800" fill="#ffffff">앱이 센서를 꺼 둠</text>
    <text x="0" y="226" text-anchor="middle" font-size="25" fill="#a7d8d2">재부팅해도 자동 유지 · 테이프 필요 없음</text>
  </g>

  <!-- footer -->
  <text x="800" y="862" text-anchor="middle" font-size="24" fill="#6b7590">NoSleep for Quest · 무료 · 오픈소스 · github.com/Leenamgi20/NoSleep-for-Quest</text>
</svg>
</body></html>
