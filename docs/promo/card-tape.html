<!doctype html>
<html><head><meta charset="utf-8"><title>NoSleep card - tape</title>
<style>html,body{margin:0;background:#0d1020}body{width:1600px;height:900px;overflow:hidden;font-family:"Segoe UI",sans-serif}</style></head>
<body>
<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#161b31"/><stop offset="1" stop-color="#0a0d18"/></linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbfbfc"/><stop offset="1" stop-color="#cdd2da"/></linearGradient>
    <linearGradient id="foam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f333d"/><stop offset="1" stop-color="#1b1e26"/></linearGradient>
    <radialGradient id="lensOff" cx="0.4" cy="0.35" r="0.7"><stop offset="0" stop-color="#4a5470"/><stop offset=".6" stop-color="#161b28"/><stop offset="1" stop-color="#090b11"/></radialGradient>
    <radialGradient id="lensOn" cx="0.5" cy="0.5" r="0.6"><stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#c8fbff"/><stop offset=".8" stop-color="#4fd8cf"/><stop offset="1" stop-color="#1c7f86"/></radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#c8fbff" stop-opacity=".7"/><stop offset=".45" stop-color="#5eead4" stop-opacity=".22"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".5"/></filter>

    <!-- Quest-2-like headset, face side: white shell, side straps, black foam, two lenses, nose gap, proximity sensor -->
    <g id="hmd">
      <path d="M-250 -40 C -300 -40, -320 40, -290 70" fill="none" stroke="#e3e6ec" stroke-width="26" stroke-linecap="round"/>
      <path d="M250 -40 C 300 -40, 320 40, 290 70" fill="none" stroke="#e3e6ec" stroke-width="26" stroke-linecap="round"/>
      <rect x="-260" y="-130" width="520" height="260" rx="110" fill="url(#white)"/>
      <rect x="-232" y="-104" width="464" height="208" rx="92" fill="url(#foam)"/>
      <path d="M-50 104 C -46 44, 46 44, 50 104 Z" fill="#11131a"/>
      <circle cx="0" cy="-62" r="10" fill="#07080c" stroke="#5a6176" stroke-width="3"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <line x1="800" y1="140" x2="800" y2="760" stroke="#2a3150" stroke-width="2" stroke-dasharray="4 10"/>

  <!-- LEFT: tape over the sensor -->
  <g transform="translate(400 430)">
    <g filter="url(#shadow)">
      <use href="#hmd"/>
      <circle cx="-104" cy="0" r="70" fill="url(#lensOff)" stroke="#0a0c12" stroke-width="6"/>
      <circle cx="104" cy="0" r="70" fill="url(#lensOff)" stroke="#0a0c12" stroke-width="6"/>
    </g>
    <g transform="translate(0 -62) rotate(-16)" filter="url(#shadow)">
      <path d="M-74 -26 L 74 -26 L 66 -18 L 76 -10 L 66 -2 L 76 6 L 66 14 L 76 22 L 74 26 L -74 26 L -66 18 L -76 10 L -66 2 L -76 -6 L -66 -14 L -76 -22 Z" fill="#e9d8a6"/>
      <rect x="-70" y="-26" width="140" height="11" fill="#fff" opacity=".3"/>
    </g>
  </g>

  <!-- RIGHT: no tape, lenses on, app toggle, survives reboot -->
  <g transform="translate(1200 430)">
    <circle cx="-104" cy="0" r="150" fill="url(#halo)"/><circle cx="104" cy="0" r="150" fill="url(#halo)"/>
    <g filter="url(#shadow)">
      <use href="#hmd"/>
      <circle cx="-104" cy="0" r="70" fill="url(#lensOn)" stroke="#0a0c12" stroke-width="6"/>
      <circle cx="104" cy="0" r="70" fill="url(#lensOn)" stroke="#0a0c12" stroke-width="6"/>
    </g>
    <!-- phone with a toggle switched on -->
    <g transform="translate(-90 250)" filter="url(#shadow)">
      <rect x="-48" y="-80" width="96" height="160" rx="16" fill="#e6e9ef"/>
      <rect x="-40" y="-68" width="80" height="136" rx="9" fill="#10141f"/>
      <rect x="-28" y="-16" width="56" height="32" rx="16" fill="#5eead4"/>
      <circle cx="12" cy="0" r="12" fill="#0f1220"/>
    </g>
    <!-- reboot arrow with check -->
    <g transform="translate(90 250)">
      <path d="M 27 -46 A 54 54 0 1 1 -27 -46" fill="none" stroke="#5eead4" stroke-width="10" stroke-linecap="round"/>
      <path d="M -44 -62 L -16 -46 L -40 -24 Z" fill="#5eead4"/>
      <path d="M-20 2 L -5 17 L 22 -12" fill="none" stroke="#5eead4" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- arrow -->
  <g transform="translate(800 430)">
    <circle r="40" fill="#5eead4"/>
    <path d="M-13 -16 L 13 0 L -13 16" fill="none" stroke="#0f1220" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="800" y="862" text-anchor="middle" font-size="26" font-weight="600" fill="#5b6488">NoSleep for Quest</text>
</svg>
</body></html>
